services:
  api:
    image: golang:1.26-alpine
    working_dir: /app
    env_file:
      - .env
      - .env.local
    environment:
      DATABASE_URL: postgres://${PGUSER:-openlocal}:${PGPASSWORD:-openlocal}@postgres:5432/${PGDATABASE:-openlocal}?sslmode=disable
      PORT: ${PORT:-8080}
    ports:
      - "${HTTP_PORT:-8080}:${PORT:-8080}"
    command: sh -c "go install github.com/air-verse/air@latest && air -c .air.toml"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - openlocal-go-build:/root/.cache/go-build
      - openlocal-go-mod:/go/pkg/mod

  worker:
    image: golang:1.26-alpine
    working_dir: /app
    env_file:
      - .env
      - .env.local
    environment:
      DATABASE_URL: postgres://${PGUSER:-openlocal}:${PGPASSWORD:-openlocal}@postgres:5432/${PGDATABASE:-openlocal}?sslmode=disable
    command: go run ./cmd/worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - .:/app
      - openlocal-go-build:/root/.cache/go-build
      - openlocal-go-mod:/go/pkg/mod

  migrate:
    image: migrate/migrate:v4.18.3
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${PGUSER:-openlocal}:${PGPASSWORD:-openlocal}@postgres:5432/${PGDATABASE:-openlocal}?sslmode=disable
    entrypoint: ["/bin/sh", "-c"]
    command: ['migrate -path /migrations -database "$$DATABASE_URL" up']
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro

  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGUSER:-openlocal}
      POSTGRES_PASSWORD: ${PGPASSWORD:-openlocal}
      POSTGRES_DB: ${PGDATABASE:-openlocal}
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - openlocal-postgres:/var/lib/postgresql/data

volumes:
  openlocal-go-build:
  openlocal-go-mod:
  openlocal-postgres:
