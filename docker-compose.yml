services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGUSER:-openlocal}
      POSTGRES_PASSWORD: ${PGPASSWORD:-openlocal}
      POSTGRES_DB: ${PGDATABASE:-openlocal}
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - openlocal-postgres:/var/lib/postgresql/data

volumes:
  openlocal-postgres:
