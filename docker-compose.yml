services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openlocal
      POSTGRES_PASSWORD: openlocal
      POSTGRES_DB: openlocal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlocal -d openlocal"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - openlocal-postgres:/var/lib/postgresql/data

volumes:
  openlocal-postgres:

