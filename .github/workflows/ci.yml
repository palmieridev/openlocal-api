name: CI

# Gates every PR and every push to a long-lived branch. Railway's "Wait for CI"
# on production keys off this workflow, so a red run keeps main from deploying.
on:
  pull_request:
  push:
    branches: [main, dev]

# One run per branch/PR; new pushes cancel the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: vet · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: go build ./...

      # sqlc output is committed, so a query edit without a regenerate would
      # silently ship stale Go. `sqlc diff` fails when the two drift apart.
      - name: sqlc up to date
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - run: sqlc diff

  modules-integration:
    name: PGMQ ${{ matrix.pgmq }} · module integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pgmq: extension
            image: openlocal-pgmq-test
          - pgmq: sql-only
            image: postgres:18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build PostgreSQL with the PGMQ extension
        if: matrix.pgmq == 'extension'
        run: docker build -f docker/postgres.Dockerfile -t openlocal-pgmq-test .
      - name: Start PostgreSQL
        run: |
          docker run -d --name openlocal-pgmq-test \
            -e POSTGRES_USER=openlocal -e POSTGRES_PASSWORD=openlocal \
            -e POSTGRES_DB=openlocal -p 5432:5432 ${{ matrix.image }}
          # The entrypoint's temporary init server accepts socket connections
          # before restarting. Only the final server listens on TCP.
          for attempt in $(seq 1 30); do
            docker exec openlocal-pgmq-test pg_isready -h 127.0.0.1 -U openlocal -d openlocal && exit 0
            sleep 1
          done
          exit 1
      - name: Install SQL-only PGMQ on PostgreSQL 18
        if: matrix.pgmq == 'sql-only'
        run: |
          # Match the source revision in docker/postgres.Dockerfile.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/pgmq/pgmq/9bb5ba79b30195e91e676d53e914fdc618ee41cd/pgmq-extension/sql/pgmq.sql \
            --output /tmp/pgmq.sql
          docker exec -i -e PGPASSWORD=openlocal openlocal-pgmq-test psql -X -h 127.0.0.1 -U openlocal -d openlocal \
            --set ON_ERROR_STOP=on --single-transaction < /tmp/pgmq.sql
      - name: Upgrade from migration 18 and verify repeat startup
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          migrate -path db/migrations -database "$DATABASE_URL" goto 18
          sh scripts/docker-entrypoint.sh true
          sh scripts/docker-entrypoint.sh true
        env:
          DATABASE_URL: postgres://openlocal:openlocal@localhost:5432/openlocal?sslmode=disable
          MIGRATIONS_PATH: db/migrations
      - name: Database integration tests
        run: go test ./internal/integration ./internal/operations ./internal/billing
        env:
          OPENLOCAL_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgres://openlocal:openlocal@localhost:5432/openlocal?sslmode=disable
      - name: PostgreSQL logs on failure
        if: failure()
        run: docker logs openlocal-pgmq-test
