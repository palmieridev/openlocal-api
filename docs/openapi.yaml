openapi: 3.1.0
info:
  title: Openlocal API
  version: 0.1.0
  description: API for Openlocal local commerce inventory, storefronts, marketplace discovery, and analytics.
servers:
  - url: http://localhost:8080
tags:
  - name: Platform Administration
    description: Private allowlisted platform business inspection, complimentary access grants, and audit activity.
  - name: Personal Account
    description: Saved businesses and verified customer request activity.
  - name: Health
    description: Service health and database readiness.
  - name: Users
    description: Current authenticated user projection.
  - name: Businesses
    description: Business onboarding and private business profile management.
  - name: Catalog
    description: Private products, variants, SKU lookup, and barcode lookup.
  - name: Inventory
    description: Stock movements and stock levels.
  - name: Analytics
    description: Inventory analytics and recommendations.
  - name: Public Storefront
    description: Public storefront profile and product data.
  - name: Marketplace
    description: Public marketplace discovery.
  - name: Webhooks
    description: Clerk and Stripe webhook receivers.
  - name: Operational Modules
    description: Appointment and preorder configuration, intake, and fulfillment.
  - name: Billing
    description: Direct Stripe subscriptions and module entitlements.
security:
  - clerkBearer: []
components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AdminCursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 1024
      description: Opaque continuation cursor. Keep search/filters unchanged between pages.
    BusinessIDQuery:
      name: business_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 25
        minimum: 1
        maximum: 100
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    CountryQuery:
      name: country
      in: query
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 2
    StateQuery:
      name: state
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    MunicipalityQuery:
      name: municipality
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    CityQuery:
      name: city
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    NeighborhoodQuery:
      name: neighborhood
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    PostalCodeQuery:
      name: postal_code
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    MinLatQuery:
      name: min_lat
      in: query
      required: false
      schema:
        type: string
    MaxLatQuery:
      name: max_lat
      in: query
      required: false
      schema:
        type: string
    MinLngQuery:
      name: min_lng
      in: query
      required: false
      schema:
        type: string
    MaxLngQuery:
      name: max_lng
      in: query
      required: false
      schema:
        type: string
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        code:
          type: string
          description: Optional machine-readable code; clients also handle errors by HTTP status.
      required:
        - error
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok
      required:
        - status
        - database
    Me:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        image_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - created_at
        - updated_at
    BusinessRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
          example: Casa Pan Local
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          example: casa-pan-local
        description:
          type: string
          example: Small-batch sourdough, pastries, and pantry goods baked every morning.
        business_type:
          type: string
          example: bakery
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        logo_url:
          type: string
          format: uri
          nullable: true
        cover_image_url:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum: [draft, active, suspended, archived]
          default: draft
        address:
          type: string
          nullable: true
        neighborhood:
          type: string
          nullable: true
          example: Condesa
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        latitude:
          type: string
          nullable: true
          example: "19.411700"
        longitude:
          type: string
          nullable: true
          example: "-99.171800"
        pickup_available:
          type: boolean
          default: true
        delivery_available:
          type: boolean
          default: false
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          default: America/Mexico_City
          example: America/Mexico_City
          description: IANA timezone used to interpret the business opening hours.
        location_mode:
          type: string
          enum: [fixed, mobile, hybrid]
          default: fixed
        service_areas:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/BusinessServiceAreaRequest"
      required:
        - name
        - description
    Business:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        clerk_org_id:
          type: string
          description: Only returned on authenticated private business responses.
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        business_type:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
          format: uri
        logo_url:
          type: string
          format: uri
        cover_image_url:
          type: string
          format: uri
        status:
          type: string
        address:
          type: string
        neighborhood:
          type: string
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postal_code:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        pickup_available:
          type: boolean
        delivery_available:
          type: boolean
        timezone:
          type: string
          example: America/Mexico_City
          description: IANA timezone used to interpret the business opening hours.
        location_mode:
          type: string
          enum: [fixed, mobile, hybrid]
        service_areas:
          type: array
          items:
            $ref: "#/components/schemas/BusinessServiceArea"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - description
        - business_type
        - pickup_available
        - delivery_available
        - timezone
        - location_mode
        - service_areas
    BusinessServiceAreaRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        country:
          type: string
          minLength: 2
          maxLength: 2
          default: MX
        state:
          type: string
          minLength: 1
          maxLength: 120
        municipality:
          type: string
          nullable: true
          maxLength: 120
        city:
          type: string
          nullable: true
          maxLength: 120
        neighborhood:
          type: string
          nullable: true
          maxLength: 120
        postal_code:
          type: string
          nullable: true
          maxLength: 20
      required:
        - name
        - state
    BusinessServiceArea:
      allOf:
        - $ref: "#/components/schemas/BusinessServiceAreaRequest"
    BusinessHourRequest:
      type: object
      additionalProperties: false
      properties:
        day_of_week:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
          description: Day of the week, where 0 is Monday and 6 is Sunday.
          example: 1
        opens_at:
          type: string
          nullable: true
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "09:00"
          description: Required in HH:MM format when the business is open; omit for closed days.
        closes_at:
          type: string
          nullable: true
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "18:00"
          description: Required in HH:MM format when the business is open; omit for closed days. May be earlier than opens_at for overnight hours.
        is_closed:
          type: boolean
          default: false
      required:
        - day_of_week
    BusinessHoursRequest:
      type: object
      additionalProperties: false
      properties:
        hours:
          type: array
          maxItems: 7
          uniqueItems: true
          description: Complete replacement schedule. Send an empty array to remove all configured hours; each day may appear at most once.
          items:
            $ref: "#/components/schemas/BusinessHourRequest"
      required:
        - hours
    BusinessHour:
      type: object
      additionalProperties: false
      properties:
        day_of_week:
          type: integer
          format: int32
          minimum: 0
          maximum: 6
          description: Day of the week, where 0 is Sunday and 6 is Saturday.
        opens_at:
          type: string
          nullable: true
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        closes_at:
          type: string
          nullable: true
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        is_closed:
          type: boolean
      required:
        - day_of_week
        - is_closed
    BusinessHours:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          example: America/Mexico_City
          description: IANA timezone used to interpret every time in the schedule.
        hours:
          type: array
          items:
            $ref: "#/components/schemas/BusinessHour"
      required:
        - timezone
        - hours
    ProductRequest:
      type: object
      additionalProperties: false
      properties:
        business_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          example: Country Sourdough
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        brand:
          type: string
          nullable: true
        unit:
          type: string
          default: piece
        product_type:
          type: string
          enum: [stocked_product, made_to_order_product, unique_item]
          default: stocked_product
        is_handmade:
          type: boolean
        is_public:
          type: boolean
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
      required:
        - business_id
        - name
        - description
    Product:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        brand:
          type: string
        unit:
          type: string
        product_type:
          type: string
        is_handmade:
          type: boolean
        is_public:
          type: boolean
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - description
        - unit
        - product_type
    VariantRequest:
      type: object
      additionalProperties: false
      properties:
        business_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        internal_code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Public details specific to this variant.
        price_note:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            Public qualification shown beside the price, for example when the
            final amount depends on measurements, materials, or finishes.
        attributes:
          type: object
          additionalProperties: true
        image_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Storefront image. Omit or send null to leave the current image
            unchanged; send an empty string to remove it. Must be an absolute
            http(s) URL.
          example: https://xyz.public.blob.vercel-storage.com/variants/abc.jpg
        price:
          type: string
          example: "120.00"
        cost:
          type: string
          nullable: true
          description: Private cost, only available to authorized business users.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          default: MXN
        track_inventory:
          type: boolean
          default: true
        public_stock_status:
          type: string
          enum: [available, low_stock, out_of_stock, made_to_order, unknown]
        is_public:
          type: boolean
          default: true
          description: >-
            Variant-level storefront switch. Omit on updates to preserve the
            current value.
        reorder_point:
          type: string
          default: "0"
        lead_time_days:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum: [active, archived]
          default: active
      required:
        - business_id
        - product_id
        - sku
        - name
        - attributes
        - price
    Variant:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        internal_code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
          maxLength: 2000
        price_note:
          type: string
          nullable: true
          maxLength: 500
        attributes:
          type: object
          additionalProperties: true
        image_url:
          type: string
          format: uri
          description: >-
            Storefront image. On variant writes, omit or send null to leave the
            current image unchanged; send an empty string to remove it. Any
            non-empty value must be an absolute http(s) URL.
        price:
          type: string
        cost:
          type: string
        currency:
          type: string
        track_inventory:
          type: boolean
        public_stock_status:
          type: string
        is_public:
          type: boolean
        reorder_point:
          type: string
        lead_time_days:
          type: integer
          format: int32
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - product_id
        - sku
        - name
        - price
        - currency
        - public_stock_status
        - is_public
    PublicProduct:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        brand:
          type: string
        unit:
          type: string
        product_type:
          type: string
        variant_id:
          type: string
          format: uuid
        sku:
          type: string
        variant_name:
          type: string
        variant_description:
          type: string
          nullable: true
          maxLength: 2000
        price_note:
          type: string
          nullable: true
          maxLength: 500
        price:
          type: string
        currency:
          type: string
        public_stock_status:
          type: string
        image_url:
          type: string
          format: uri
      required:
        - id
        - name
        - slug
        - description
        - unit
        - product_type
        - variant_id
        - sku
        - variant_name
        - price
        - currency
        - public_stock_status
    MarketplaceProduct:
      allOf:
        - $ref: "#/components/schemas/PublicProduct"
        - type: object
          additionalProperties: false
          properties:
            business_slug:
              type: string
            business_name:
              type: string
          required:
            - business_slug
            - business_name
    StockMovementRequest:
      type: object
      additionalProperties: false
      properties:
        business_id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
          nullable: true
        movement_type:
          type: string
          enum: [IN_PURCHASE, IN_PRODUCTION, OUT_SALE, OUT_ADJUSTMENT, IN_ADJUSTMENT, OUT_LOSS]
        quantity:
          type: string
          example: "5"
        unit_cost:
          type: string
          nullable: true
        reference_type:
          type: string
          nullable: true
        reference_id:
          type: string
          nullable: true
        notes:
          type: string
      required:
        - business_id
        - variant_id
        - movement_type
        - quantity
    StockMovement:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        movement_type:
          type: string
        quantity:
          type: string
        unit_cost:
          type: string
          nullable: true
        reference_type:
          type: string
          nullable: true
        reference_id:
          type: string
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
    StockLevel:
      type: object
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        quantity_on_hand:
          type: string
        quantity_reserved:
          type: string
        updated_at:
          type: string
          format: date-time
    StockMovementResult:
      type: object
      additionalProperties: false
      properties:
        movement:
          $ref: "#/components/schemas/StockMovement"
        stock_level:
          $ref: "#/components/schemas/StockLevel"
      required:
        - movement
        - stock_level
    EOQ:
      type: object
      additionalProperties: false
      properties:
        variant_id:
          type: string
          format: uuid
        period_days:
          type: integer
          format: int32
        demand:
          type: string
        estimated_eoq:
          type: string
        order_cost:
          type: string
        holding_cost_rate:
          type: string
    ClerkWebhookEvent:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          example: user.created
        data:
          type: object
          additionalProperties: true
      required:
        - type
        - data
    PersonalBusiness:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type:
          - string
          - 'null'
        available:
          type: boolean
        logo_url:
          type:
          - string
          - 'null'
      required:
      - id
      - name
      - slug
      - available
      - logo_url
    PersonalActivityItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum:
          - appointments
          - preorders
        reference:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
        business:
          $ref: '#/components/schemas/PersonalBusiness'
      required:
      - id
      - module
      - reference
      - status
      - created_at
      - starts_at
      - ends_at
      - timezone
      - business
    PersonalPreorderItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        variant_id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          type: string
        quantity:
          type: string
        unit_price:
          type: string
        total:
          type: string
        final_quantity:
          type:
          - string
          - 'null'
      required:
      - id
      - variant_id
      - name
      - unit
      - quantity
      - unit_price
      - total
      - final_quantity
    PersonalStatusHistory:
      type: object
      additionalProperties: false
      properties:
        from_status:
          type: string
        to_status:
          type: string
        at:
          type: string
          format: date-time
        actor:
          type: string
      required:
      - from_status
      - to_status
      - at
      - actor
    PersonalRequestDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
          enum:
          - appointments
          - preorders
        reference:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
        business:
          $ref: '#/components/schemas/PersonalBusiness'
        version:
          type: integer
        expires_at:
          type: string
          format: date-time
        customer_name:
          type: string
        customer_phone:
          type: string
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        duration_minutes:
          type: integer
        price:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonalPreorderItem'
        estimated_total:
          type: string
        final_total:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/PersonalStatusHistory'
        allowed_transitions:
          type: array
          items:
            type: string
            enum:
            - cancelled
      required:
      - id
      - module
      - reference
      - status
      - created_at
      - starts_at
      - ends_at
      - timezone
      - business
      - version
      - expires_at
      - customer_name
      - customer_phone
      - history
      - allowed_transitions
    PersonalAppointmentInput:
      type: object
      additionalProperties: false
      properties:
        customer_name:
          type: string
          minLength: 2
          maxLength: 120
        customer_phone:
          type: string
          description: International phone; contact data only, never identity proof.
        notes:
          type: string
          maxLength: 1280
        challenge_token:
          type: string
          description: Turnstile request challenge, required in production.
        locale:
          type: string
        service_id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
      required:
      - customer_name
      - customer_phone
      - service_id
      - resource_id
      - starts_at
    PersonalPreorderInput:
      type: object
      additionalProperties: false
      properties:
        customer_name:
          type: string
          minLength: 2
