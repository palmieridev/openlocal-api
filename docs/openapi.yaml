                $ref: '#/components/schemas/Error'
        '403':
          description: Identity is not in PLATFORM_ADMIN_USER_IDS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Private rate limit exceeded
          content:
            application/json:
