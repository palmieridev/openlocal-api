paths:
  /healthz:
    get:
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/me:
    get:
      tags:
        - Users
      responses:
        "200":
          description: Current local user projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing or invalid Clerk token.
  /api/v1/businesses:
    post:
      tags:
        - Businesses
      description: Creates a Clerk organization and the matching Openlocal business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRequest"
      responses:
        "201":
          description: Business created. Response includes clerk_org_id for frontend org activation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "502":
          description: Clerk organization creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/businesses/me:
    get:
      tags:
        - Businesses
      description: Resolves the current Openlocal business from the active Clerk organization claim.
      responses:
        "200":
          description: Private business profile for the active Clerk organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "403":
          description: Active Clerk organization or local business membership is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Openlocal business is linked to the active Clerk organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/webhooks/clerk:
    post:
      tags:
        - Webhooks
      security: []
      description: Clerk webhook receiver for user, organization, and membership sync. Requires valid Svix signature headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClerkWebhookEvent"
      responses:
        "204":
          description: Webhook accepted.
        "400":
          description: Invalid signature or payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Webhook signing secret is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/businesses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Businesses
      responses:
        "200":
          description: Private business profile for an authorized member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
    patch:
      tags:
        - Businesses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRequest"
      responses:
        "200":
          description: Updated private business profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
  /api/v1/businesses/{id}/hours:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Businesses
      description: Returns the opening-hours schedule for an authorized business member.
      responses:
        "200":
          description: Business opening hours ordered by day of week.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHours"
        "403":
          description: Owner, manager, or staff membership is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - Businesses
      description: Atomically replaces the complete opening-hours schedule. Overnight ranges are supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessHoursRequest"
      responses:
        "200":
          description: Updated business opening hours ordered by day of week.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHours"
        "400":
          description: Invalid weekday, duplicate day, or invalid opening-hours combination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner or manager membership is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/products:
    get:
      tags:
        - Catalog
      parameters:
        - $ref: "#/components/parameters/BusinessIDQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
      responses:
        "200":
          description: Private product list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Catalog
      responses:
        "200":
          description: Private product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      tags:
        - Catalog
      responses:
        "204":
          description: Product archived.
  /api/v1/products/{id}/variants:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/BusinessIDQuery"
    get:
      tags:
        - Catalog
      description: Lists all variants for a product scoped to the caller's business.
      responses:
        "200":
          description: Private variants for the product.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variant"
  /api/v1/variants:
    post:
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantRequest"
      responses:
        "201":
          description: Variant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
  /api/v1/variants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Catalog
      responses:
        "200":
          description: Private variant, including cost for authorized users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
    patch:
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantRequest"
      responses:
        "200":
          description: Variant updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
    delete:
      tags:
        - Catalog
      responses:
        "204":
          description: Variant archived.
  /api/v1/variants/by-barcode/{barcode}:
    get:
      tags:
        - Catalog
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/BusinessIDQuery"
      responses:
        "200":
          description: Business-scoped barcode lookup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
  /api/v1/variants/by-sku/{sku}:
    get:
      tags:
        - Catalog
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/BusinessIDQuery"
      responses:
        "200":
