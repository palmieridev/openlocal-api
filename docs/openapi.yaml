          description: 'Success. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrantPage'
        '400':
          description: Invalid JSON, identifier, enum, date, reason, or pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
