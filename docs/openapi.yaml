          description: Missing or invalid Clerk token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Platform administrator required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Business or grant not found in scope
          content:
            application/json:
              schema:
