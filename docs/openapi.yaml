  /api/v1/admin/businesses:
    get:
      tags:
      - Platform Administration
      summary: Search businesses across the platform
      description: Ordered by created_at DESC, id DESC. Requires an exact allowlisted
        verified Clerk user ID; organization roles do not grant access. Empty PLATFORM_ADMIN_USER_IDS
        denies all. See docs/platform-admin-api.md.
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/AdminCursorQuery'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
        description: Trimmed literal case-insensitive name/slug substring, or exact
          canonical UUID/Clerk organization ID. Empty lists all statuses.
      responses:
        '200':
          description: 'Success. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBusinessPage'
        '400':
          description: Invalid input or cursor
          content:
            application/json:
