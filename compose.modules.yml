# Isolated local services: does not use or replace the developer's existing DB.
name: openlocal-modules
services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: openlocal
      POSTGRES_PASSWORD: local-modules-only
      POSTGRES_DB: openlocal_modules
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["modules-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlocal -d openlocal_modules"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build: .
    env_file:
      - path: .env.local
        required: false
    environment: &runtime
      APP_ENV: development
      DATABASE_URL: postgres://openlocal:local-modules-only@postgres:5432/openlocal_modules?sslmode=disable
      PORT: 8080
      AUTH_TEST_BYPASS: "${MODULES_TEST_AUTH:-false}"
      MODULES_ALLOW_TEST_CHALLENGE: "true"
      MODULES_TOKEN_KEY: bG9jYWwtbW9kdWxlcy1vbmx5LXRlc3Qta2V5LTEyMzQ=
      APP_BASE_URL: http://localhost:4321
      CORS_ALLOWED_ORIGINS: http://localhost:4321,http://127.0.0.1:4321
      CLERK_AUTHORIZED_PARTIES: http://localhost:4321,http://127.0.0.1:4321
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: ["openlocal-worker"]
    env_file:
      - path: .env.local
        required: false
    environment:
      <<: *runtime
      RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_started
volumes:
  modules-postgres:
